## Defence config —— 高低频 + 区域感知净化防御
# 用法：python main.py defend --config configs/defence_config/example_defence.toml

[Defense]

method = "freq_region_purify"                   # 固定方法名
backbone = "resnet50"                            # resnet50 | siglip
checkpoint = "model/trained_classifier/resnet50/resnet50_psoriasis224_2c.pt"  # 被攻击的分类器
batch_report = "output/batch_attack/resnet50/psoriasis224_2c/batch_report.json"  # 批量攻击结果

[Defense.purify]

window = 3                                       # 局部中值窗口（用于 mask 判定与 median 重建）
threshold = 0.08                                  # 可疑像素偏离阈值（像素范围 0~1）
dilation = 1                                      # 可疑区域膨胀半径
low_freq_cutoff = 0.25                            # FFT 低频重建的截止频率比例
low_freq = "fft"                                  # 低频重建方式：fft | median

[Output]

output_dir = "output/defense"                     # 防御报告输出根目录
report_name = "defense_report.json"               # 报告文件名
